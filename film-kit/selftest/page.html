<!doctype html><html><head><meta charset="utf-8"><title>film-kit selftest</title>
<style>body{font-family:sans-serif;margin:0}header{height:44px;background:#1e293b}main{padding:40px}
label{display:block;margin:12px 0}select,button{font-size:16px;padding:6px 10px}</style></head>
<body><header></header><main><h2>Record #42</h2>
<label>Assigned user <select id="assignee"><option>Demo UserOne</option><option>Demo UserTwo</option></select></label>
<button id="save">Save</button><p id="status"></p></main>
<script>
document.getElementById('save').onclick = async () => {
  await fetch('/api/record', { method: 'POST', body: '{}' });
  if (new URLSearchParams(location.search).get('side') === 'before') await fetch('/api/notification/record/42', { method: 'POST', body: '{}' });
  document.getElementById('status').textContent = 'Saved';
};
</script></body></html>
